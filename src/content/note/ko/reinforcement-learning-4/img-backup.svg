<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 360" font-family="sans-serif">
<rect width="680" height="360" fill="#ffffff"/>
<text x="170" y="30" font-size="15" fill="#2C2C2A" text-anchor="middle">v<tspan font-size="10" baseline-shift="sub">π</tspan>(s)의 백업</text>
<line x1="170" y1="70" x2="100" y2="160" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="170" y1="70" x2="240" y2="160" stroke="#2C2C2A" stroke-width="1.2"/>
<circle cx="170" cy="70" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/><text x="186" y="75" font-size="14" fill="#2C2C2A" text-anchor="start" font-style="italic">s</text>
<text x="110" y="118" font-size="12" fill="#534AB7" text-anchor="end">π(a | s)</text>
<line x1="100" y1="160" x2="60" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="100" y1="160" x2="140" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="240" y1="160" x2="200" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="240" y1="160" x2="280" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<circle cx="100" cy="160" r="6" fill="#2C2C2A"/><text x="112" y="165" font-size="14" fill="#2C2C2A" font-style="italic">a</text>
<circle cx="240" cy="160" r="6" fill="#2C2C2A"/>
<text x="72" y="196" font-size="12" fill="#0F6E56" text-anchor="end">p(s' | s, a)</text>
<text x="72" y="212" font-size="12" fill="#0F6E56" text-anchor="end">r</text>
<circle cx="60" cy="250" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/>
<circle cx="140" cy="250" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/>
<circle cx="200" cy="250" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/>
<circle cx="280" cy="250" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/>
<text x="60" y="285" font-size="14" fill="#2C2C2A" text-anchor="middle">s'</text>
<text x="170" y="325" font-size="12" fill="#5F5E5A" text-anchor="middle">상태에서 시작: 정책이 행동을 고르고,</text>
<text x="170" y="343" font-size="12" fill="#5F5E5A" text-anchor="middle">환경이 다음 상태와 보상을 정한다</text>
<text x="510" y="30" font-size="15" fill="#2C2C2A" text-anchor="middle">q<tspan font-size="10" baseline-shift="sub">π</tspan>(s, a)의 백업</text>
<line x1="510" y1="70" x2="440" y2="160" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="510" y1="70" x2="580" y2="160" stroke="#2C2C2A" stroke-width="1.2"/>
<circle cx="510" cy="70" r="6" fill="#2C2C2A"/><text x="522" y="75" font-size="14" fill="#2C2C2A" font-style="italic">s, a</text>
<text x="450" y="110" font-size="12" fill="#0F6E56" text-anchor="end">p(s' | s, a)</text>
<text x="450" y="126" font-size="12" fill="#0F6E56" text-anchor="end">r</text>
<line x1="440" y1="160" x2="400" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="440" y1="160" x2="480" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="580" y1="160" x2="540" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<line x1="580" y1="160" x2="620" y2="250" stroke="#2C2C2A" stroke-width="1.2"/>
<circle cx="440" cy="160" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/><text x="424" y="165" font-size="14" fill="#2C2C2A" text-anchor="end" font-style="italic">s'</text>
<circle cx="580" cy="160" r="11" fill="#ffffff" stroke="#2C2C2A" stroke-width="1.3"/>
<text x="390" y="212" font-size="12" fill="#534AB7" text-anchor="end">π(a' | s')</text>
<circle cx="400" cy="250" r="6" fill="#2C2C2A"/>
<circle cx="480" cy="250" r="6" fill="#2C2C2A"/>
<circle cx="540" cy="250" r="6" fill="#2C2C2A"/>
<circle cx="620" cy="250" r="6" fill="#2C2C2A"/>
<text x="400" y="280" font-size="14" fill="#2C2C2A" text-anchor="middle">a'</text>
<text x="510" y="325" font-size="12" fill="#5F5E5A" text-anchor="middle">행동에서 시작: 환경이 다음 상태와 보상을 정하고,</text>
<text x="510" y="343" font-size="12" fill="#5F5E5A" text-anchor="middle">그 뒤로 정책이 행동을 고른다</text>
<line x1="340" y1="20" x2="340" y2="300" stroke="#D3D1C7" stroke-width="1.2"/>
</svg>